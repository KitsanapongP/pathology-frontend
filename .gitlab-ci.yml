# CI/CD ของ pathology-web — รันบน GitLab Runner ของ group บน server dev (ดู ../infra/README.md หัวข้อ GitLab Runner)
#   tag dev-v*  → test + audit → deploy dev อัตโนมัติ (docker บนเครื่อง dev)
#   tag prod-v* → test + audit → กด deploy-prod เอง → runner ของ prod (tag pathology-prod) build + docker compose up -d บน prod เอง
#   MR / ทุก branch → test + audit อย่างเดียว
# web ยังไม่มี config ตอน runtime (NEXT_PUBLIC_* ฝังตอน build) จึงไม่มี .env บน server — ถ้าเพิ่มเมื่อไรให้ทำแบบ backend
#   (.env อยู่บน server เท่านั้น, CI ตรวจว่ามีแต่ไม่เขียนทับ, แม่แบบ deploy/<env>.env.example)
# ไม่มี CI/CD variable ที่ต้องตั้ง

default:
  # instance runner ของ gitlab.com ปิดไว้ (ไม่เสีย compute minutes) — ทุก job ต้องลง runner ของเรา
  tags: [pathology-dev]

variables:
  SERVICE: pathology-web
  NEXT_TELEMETRY_DISABLED: "1"

stages:
  - test
  - deploy

.on_ci:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # branch ที่มี MR เปิดอยู่รันแค่ MR pipeline — ไม่รันซ้ำสองชุด
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^(dev|prod)-v.+$/'

##############################################################################
##                                   Test                                   ##
##############################################################################
# ชื่อ branch ต้องเป็น main / dev / feature/* / fix/* / hotfix/* (ตรงกับ protected branches ที่ปิด force push)
# ใช้คู่กับ Settings → Merge requests → Pipelines must succeed: MR จาก branch ชื่อผิด merge ไม่ได้
branch-name:
  stage: test
  image: alpine:3.22
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  script:
    - BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}"
    - |
      if ! echo "$BRANCH" | grep -Eq '^(main|dev|(feature|fix|hotfix)/[A-Za-z0-9._-]+)$'; then
        echo "ชื่อ branch '$BRANCH' ไม่ถูกต้อง — ใช้ feature/<ชื่อ>, fix/<ชื่อ> หรือ hotfix/<ชื่อ>"
        echo "เปลี่ยนชื่อ: git branch -m feature/<ชื่อ> แล้ว push ใหม่ (เปิด MR ใหม่จาก branch นั้น)"
        exit 1
      fi
    - echo "branch '$BRANCH' ถูกต้อง"

.node_job:
  extends: .on_ci
  stage: test
  image: node:24-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # ห้ามเปลี่ยนเป็น npm install — lockfile ต้องผ่าน npm ci บน Linux (ดู docs/development-setup.md)
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

# lint + typecheck + unit test + build
verify:
  extends: .node_job
  script:
    - npm run check

dependency-audit:
  extends: .node_job
  script:
    - npm run security:audit

# Playwright build แล้วเปิด production server ของตัวเองบน 127.0.0.1:3100
e2e:
  extends: .node_job
  script:
    - npx --no-install playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    # trace อาจมี DOM/network — เก็บเฉพาะตอน fail และหมดอายุเร็ว
    when: on_failure
    expire_in: 3 days
    paths:
      - playwright-report/
      - test-results/

##############################################################################
##                                  Deploy                                  ##
##############################################################################
# build บน server ที่ runner อยู่ (dev หรือ prod) ผ่าน docker socket ของ host (runner mount ไว้ให้) — image = pathology-web:<tag>
.docker_build:
  stage: deploy
  image: docker:29-cli
  before_script:
    - export IMAGE="$SERVICE:$CI_COMMIT_TAG"
    - docker build -t "$IMAGE" -f Dockerfile .

deploy-dev:
  extends: .docker_build
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_TAG =~ /^dev-v.+$/'
  variables:
    # runner mount /opt/pathology/dev/apps ที่ path เดียวกับ host (../infra document/deploy/dev/03-gitlab-runner.md)
    APP_DIR: /opt/pathology/dev/apps/pathology-web
  script:
    - mkdir -p "$APP_DIR"
    - cp deploy/compose.yml "$APP_DIR/compose.yml"
    - cd "$APP_DIR" && IMAGE_TAG="$CI_COMMIT_TAG" DEPLOY_ENV=dev docker compose up -d
    - docker image prune -f

# runner ของ prod mount /opt/pathology/prod/apps ที่ path เดียวกับ host (../infra document/deploy/prod/03-gitlab-runner.md)
deploy-prod:
  extends: .docker_build
  tags: [pathology-prod]
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-v.+$/'
      when: manual
  variables:
    APP_DIR: /opt/pathology/prod/apps/pathology-web
  script:
    - mkdir -p "$APP_DIR"
    - cp deploy/compose.yml "$APP_DIR/compose.yml"
    - cd "$APP_DIR" && IMAGE_TAG="$CI_COMMIT_TAG" DEPLOY_ENV=prod docker compose up -d
    - docker image prune -f
