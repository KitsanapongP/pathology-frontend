image: node:24-bookworm

stages:
  - verify
  - browser

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

variables:
  NEXT_TELEMETRY_DISABLED: "1"

verify:
  stage: verify
  script:
    - npm run check

browser:
  stage: browser
  script:
    - npx --no-install playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths:
      - playwright-report/
      - test-results/

dependency-audit:
  stage: verify
  script:
    - npm run security:audit
