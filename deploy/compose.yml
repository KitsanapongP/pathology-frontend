# ใช้ deploy pathology-web บน server dev/prod เท่านั้น (ถูกเรียกจาก .gitlab-ci.yml) — infra กลางอยู่ที่ ../infra
# ต้องส่ง IMAGE_TAG (git tag ที่ build) และ DEPLOY_ENV (dev | prod) ตอนรัน:
#   IMAGE_TAG=prod-v1.2.0 DEPLOY_ENV=prod docker compose up -d
# รันบนเครื่องตัวเองใช้ compose.yaml ที่ root ของ repo แทน
name: pathology-web

services:
  web:
    image: pathology-web:${IMAGE_TAG:?IMAGE_TAG is required}
    # ต้องตรงกับ UPSTREAM_WEB ของ nginx ใน infra
    container_name: pathology-web
    restart: unless-stopped
    # ไม่เปิด port — เข้าผ่าน nginx ของ infra (app.<NGINX_DOMAIN>)
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [pathology]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  pathology:
    external: true
    name: pathology-${DEPLOY_ENV:?DEPLOY_ENV is required}
