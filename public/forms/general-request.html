<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฟอร์มคำร้องทั่วไป</title><style>body{font-family:Tahoma,Arial,sans-serif;color:#18355d;margin:0;background:#f0f4fa}main{max-width:750px;min-height:940px;margin:32px auto;padding:48px;background:white;box-sizing:border-box}h1{text-align:center;font-size:23px;margin:12px 0 8px}header{text-align:center;border-bottom:2px solid #244c80;padding-bottom:24px;margin-bottom:28px}header p{font-size:14px}label{display:block;margin:24px 0;font-size:14px;line-height:2.2}.line{display:inline-block;min-width:180px;border-bottom:1px dotted #889ab0;height:24px;vertical-align:bottom}.full{min-width:100%}.description{height:220px;border:1px solid #b5c5d9;margin:8px 0 30px}footer{display:flex;justify-content:space-between;gap:24px;margin-top:64px;font-size:14px}button{display:block;margin:20px auto;padding:10px 24px;border:0;border-radius:6px;background:#163f78;color:white;cursor:pointer}@media print{body{background:white}main{margin:0;padding:20px;min-height:auto;max-width:none}button{display:none}@page{size:A4;margin:20mm}}</style></head><body><button onclick="window.print()">พิมพ์แบบฟอร์ม</button><main><header><h1>แบบฟอร์มคำร้องทั่วไป</h1><p>ภาควิชาพยาธิวิทยา</p></header><label>โรงพยาบาล / หน่วยงาน <span class="line" style="width:65%"></span></label><label>วันที่ <span class="line"></span> เลขที่คำร้อง <span class="line"></span></label><label>HN <span class="line"></span> ชื่อผู้ป่วย <span class="line" style="width:45%"></span></label><label>ผู้ส่งคำร้อง <span class="line" style="width:70%"></span></label><label>รายละเอียดคำร้อง</label><div class="description"></div><label>เอกสารแนบ <span class="line" style="width:75%"></span></label><footer><div>ลงชื่อ <span class="line"></span><br>ผู้ส่งคำร้อง</div><div>ลงชื่อ <span class="line"></span><br>ผู้รับคำร้อง</div></footer></main></body></html>
